# Patato 服务端配置示例。复制为 config.yaml 后按需修改。
# 敏感项也可以用环境变量覆盖：PATATO_DATABASE_URL、PATATO_SECRET_KEY、PATATO_TELEGRAM_BOT_TOKEN、
# PATATO_TELEGRAM_CHAT_ID、PATATO_SMTP_PASSWORD、PATATO_TOLATO_API_KEY、PATATO_NODE_LEGACY_TOKEN。

listen: ":8080"
database_url: "postgres://patato:patato@postgres:5432/patato?sslmode=disable"
# 至少 32 个字符；用于加密节点密钥、给 Telegram 回调签名。生成：openssl rand -hex 32
secret_key: "change-me-change-me-change-me-change-me"

# API 对外地址：节点后端、CLI、订阅链接都用它
public_url: "https://api.example.com"
# 两个前端的地址：用于内嵌页面的 Host 分发、跨域、passkey 来源校验和邮件里的链接
# 使用不同域名（或不同端口），不支持 /admin 等子路径；代理须保留原始 Host
admin_url: "https://admin.example.com"
portal_url: "https://my.example.com"
# 订阅链接的域名，默认等于 public_url
subscribe_url: ""
# 兼容 Xboard 自定义的订阅路径，例如 "/s"；留空时只提供 /api/v1/client/subscribe?token=
subscribe_path: ""
service_name: "Patato"
timezone: "Asia/Shanghai"
# 非空时开放 /metrics 给 Prometheus 抓取，请求带 Authorization: Bearer <metrics_token>
metrics_token: ""

node:
  push_interval: 60
  pull_interval: 60
  # 超过这个时间没有心跳，节点被标记为离线并告警
  offline_after: 5m
  # 在线设备的统计窗口
  device_ttl: 5m
  # 迁移过渡期：Xboard 的全局 server_token。只对导入时标记了 allow_legacy_token 的节点生效。
  # 节点逐台换成自己的密钥后删掉这一项。
  legacy_token: ""

risk:
  # 常规操作影响超过任一阈值时升为敏感，需要审批
  user_threshold: 100
  node_threshold: 5

change:
  plan_ttl: 30m
  approval_ttl: 30m

session:
  operator_ttl: 12h
  user_ttl: 720h
  secure: true

webauthn:
  # passkey 的依赖方 ID，通常是 Admin 的主域名
  rp_id: "example.com"
  rp_name: "Patato"
  # 默认等于 admin_url
  origins: []

telegram:
  bot_token: ""
  # 接收审批卡片和告警的会话 ID
  chat_id: 0

smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  from: "Patato <no-reply@example.com>"

tolato:
  url: ""
  api_key: ""
  # Patato 所在主机在 tolato 里的名称；有针对它的远程执行就告警
  panel_host: ""
  poll_every: 1m
