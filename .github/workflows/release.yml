name: release

# 推送 v 开头的 tag 时发布：
#   - GitHub Release：CLI（Linux / macOS / Windows × amd64 / arm64）、patato-node（Linux × amd64 / arm64）、
#     一键部署文件（install.sh、install-cli.sh、docker-compose.yaml、Caddyfile、config.example.yaml）和 checksums.txt
#   - 服务端镜像：ghcr.io/momaek/patato-server:<tag>（linux/amd64、linux/arm64），正式版同时打 latest
# 带 - 的 tag（如 v0.2.0-rc.1）发成预发布，不更新 latest，install.sh 默认也不会装到它。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的已有 tag，例如 v0.1.0
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $TAG 不是 vX.Y.Z 形式" >&2; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -tags with_quic,with_utls,with_acme ./cli/... ./node/... ./nodeapi/... ./server/internal/config/...
      - name: Build release assets
        run: scripts/release.sh "$TAG"
      - name: Smoke test
        run: |
          dist/patato-linux-amd64 version | grep -F "$TAG"
          dist/patato-node-linux-amd64 version | grep -F "$TAG"
          bash -n dist/install.sh
          sh -n dist/install-cli.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/patato-server
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 镜像和二进制都成功后才创建 Release，避免 install.sh 拿到一个镜像还不存在的版本
  publish:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --generate-notes "${prerelease[@]}" --title "$TAG"
          fi
