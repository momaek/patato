name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: patato
          POSTGRES_PASSWORD: patato
          POSTGRES_DB: patato
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U patato" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PATATO_TEST_DATABASE_URL: postgres://patato:patato@localhost:5432/patato?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make lint
      - name: Generated code is up to date
        run: make check-generated
      - name: Test
        run: go test -race -tags with_quic,with_utls,with_acme ./...
      - name: Build
        run: |
          go build -o bin/patato-server ./server/cmd/patato-server
          go build -tags with_quic,with_utls,with_acme -o bin/patato-node ./node/cmd/patato-node
          go build -o bin/patato ./cli/cmd/patato

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date with the contract
        run: pnpm gen:api && git diff --exit-code packages/api/src/schema.d.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Embedded frontend tests and server build
        run: |
          go test -tags embedweb ../server/internal/frontend ../server/internal/api .
          go build -tags embedweb -o ../bin/patato-server ../server/cmd/patato-server

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image (includes both frontends)
        run: docker build -f server/Dockerfile -t patato-server:ci .
      - name: Deploy files are valid
        run: |
          bash -n deploy/install.sh && sh -n scripts/install-cli.sh && bash -n scripts/release.sh
          shellcheck deploy/install.sh scripts/install-cli.sh scripts/release.sh
          cd deploy && docker compose -f docker-compose.yaml -f docker-compose.build.yaml config -q
