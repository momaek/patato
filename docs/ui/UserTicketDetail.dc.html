</div>

<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; flex: 1 1 auto; overflow-y: auto">
<li style="align-self: flex-end; max-width: 86%; display: flex; flex-direction: column; gap: 4px; align-items: flex-end">

<span style="font-size: 12px; color: #56625C">你，10-30 21:12</span>
</li>
<li style="align-self: flex-start; max-width: 86%; display: flex; flex-direction: column; gap: 4px">
<div style="padding: 12px 14px; border-radius: 14px 14px 14px 4px; background: #FFFFFF; border: 1px solid #D9DFDB">晚高峰东京-01 负载比较高。我们新加了东京-03，今天会加入高级套餐。上线后在客户端里更新一次订阅，就能看到新节点。</div>

<button type="button" style="flex: 1 1 0; min-height: 46px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; color: #18201D; font: inherit; font-weight: 500; cursor: pointer">问题已解决</button>
