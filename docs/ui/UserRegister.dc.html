<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户侧 注册</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6F5}
a{color:#2B44C4}a:hover{color:#1E3299}
:focus-visible{outline:2px solid #2B44C4;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 28px; background: #F4F6F5; color: #18201D; font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif; font-size: 15px; line-height: 1.6">

<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #2B44C4; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 600">S</span>
<span style="font-size: 18px; font-weight: 600">[你的服务名]</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">注册</h1>
<p style="margin: 0; color: #56625C">注册后选一个套餐，就能开始使用。</p>
</div>

<form style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 500">邮箱</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="code" style="font-size: 14px; font-weight: 500">邮箱验证码</label>
<div style="display: flex; gap: 8px">
<input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" style="flex: 1 1 0; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
<button type="button" onClick="{{sendCode}}" style="flex: none; min-height: 48px; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; color: #18201D; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{codeLabel}}</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw" style="font-size: 14px; font-weight: 500">密码</label>
<input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-rule" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
<span id="pw-rule" style="font-size: 13px; color: #56625C">至少 8 位</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="invite" style="font-size: 14px; font-weight: 500">邀请码（选填）</label>
<input id="invite" type="text" value="K7Q2M9" aria-describedby="invite-note" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
<span id="invite-note" style="font-size: 13px; color: #56625C">已从朋友的邀请链接自动填入</span>
</div>
<label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: #2E3833">
<input type="checkbox" style="width: 20px; height: 20px; margin: 2px 0 0; flex: none">
<span>我已阅读并同意 <a href="#">[服务条款]</a></span>
</label>
<a href="UserPlans.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">注册</a>
</form>

<p style="margin: auto 0 0; font-size: 14px; color: #56625C; text-align: center">已有账号？<a href="UserLogin.dc.html">登录</a></p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = !!(this.state && this.state.sent);
    return {
      codeLabel: sent ? '60 秒后重发' : '发送验证码',
      sendCode: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
