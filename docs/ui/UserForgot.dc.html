<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户侧 找回密码</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6F5}
a{color:#2B44C4}a:hover{color:#1E3299}
:focus-visible{outline:2px solid #2B44C4;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 36px; background: #F4F6F5; color: #18201D; font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif; font-size: 15px; line-height: 1.6">

<a href="UserLogin.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; align-self: flex-start; font-size: 15px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"></path></svg>返回登录</a>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">找回密码</h1>
<p style="margin: 0; color: #56625C">输入账号的邮箱，我们会发一封重置密码的邮件。</p>
</div>

<sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
<form style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 500">邮箱</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
</div>
<button type="button" onClick="{{send}}" style="min-height: 50px; border: 0; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">发送重置邮件</button>
</form>
</sc-if>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #FFFFFF; border: 1px solid #D9DFDB; border-radius: 12px">
<p style="margin: 0; font-size: 17px; font-weight: 600">邮件已发送</p>
<p style="margin: 0; color: #2E3833">如果 you@example.com 是这里的账号，你会收到一封重置邮件，里面的链接 30 分钟内有效。</p>
<p style="margin: 0; font-size: 14px; color: #56625C">没收到？先看看垃圾邮件，60 秒后可以重新发送。</p>
<a href="UserNewPassword.dc.html" style="font-size: 14px; font-weight: 500">模拟：打开邮件里的链接</a>
</div>
</sc-if>

<p style="margin: auto 0 0; font-size: 13px; color: #56625C; text-align: center">换了邮箱、收不到邮件？联系 [客服联系方式]</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = !!(this.state && this.state.sent);
    return {
      sent: sent,
      notSent: !sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
