<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户侧 支付</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6F5}
a{color:#2B44C4}a:hover{color:#1E3299}
:focus-visible{outline:2px solid #2B44C4;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 32px; display: flex; flex-direction: column; gap: 24px; background: #F4F6F5; color: #18201D; font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif; font-size: 15px; line-height: 1.6">

<a href="UserPlans.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; align-self: flex-start; text-decoration: none"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"></path></svg>返回续费与购买</a>

<sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 1.3">支付订单</h1>
<p style="margin: 0; font-size: 14px; color: #56625C">请在 30 分钟内完成支付，超时订单自动取消</p>
</div>

<section aria-label="订单信息" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; background: #FFFFFF; border: 1px solid #D9DFDB; border-radius: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 600">高级套餐 3 个月</span>
<span style="font-size: 20px; font-weight: 600">[应付金额]</span>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px">
<dt style="color: #56625C">订单号</dt><dd style="margin: 0; text-align: right; font-family: 'IBM Plex Mono', monospace">ord_01JA2C7N</dd>
<dt style="color: #56625C">付款后到期</dt><dd style="margin: 0; text-align: right">2027-03-15</dd>
</dl>
</section>

<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 17px; font-weight: 600">支付方式</legend>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #2B44C4; border-radius: 12px; cursor: pointer">
<input type="radio" name="pay" checked style="width: 20px; height: 20px; margin: 0; accent-color: #2B44C4">
<span style="font-weight: 500">[支付方式 A]</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #C9D0CC; border-radius: 12px; cursor: pointer">
<input type="radio" name="pay" style="width: 20px; height: 20px; margin: 0; accent-color: #2B44C4">
<span style="font-weight: 500">[支付方式 B]</span>
</label>
<label style="display: flex; align-items: center; gap: 12px; min-height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 1px solid #C9D0CC; border-radius: 12px; cursor: pointer">
<input type="radio" name="pay" style="width: 20px; height: 20px; margin: 0; accent-color: #2B44C4">
<span style="display: flex; flex-direction: column"><span style="font-weight: 500">邀请返佣余额</span><span style="font-size: 12px; color: #56625C">可用 [余额]，不足部分用其他方式补齐</span></span>
</label>
</fieldset>

<button type="button" onClick="{{pay}}" style="min-height: 52px; border: 0; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">确认支付 [应付金额]</button>
</div>
</sc-if>

<sc-if value="{{paid}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 16px; padding: 24px 20px; background: #FFFFFF; border: 1px solid #D9DFDB; border-radius: 14px">
<span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #E3F2EA; display: inline-flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#1C6B45" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 11.5 4 4 8-9"></path></svg></span>
<h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 1.35">支付成功</h1>
<p style="margin: 0; color: #2E3833">高级套餐已续到 2027-03-15。订阅链接不变，客户端不用重新导入。</p>
<p style="margin: 0; font-size: 13px; color: #56625C">订单号 <span style="font-family: 'IBM Plex Mono', monospace">ord_01JA2C7N</span></p>
<a href="UserHome.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font-weight: 600; text-decoration: none">回到我的订阅</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paid: false };
  }
  renderVals() {
    const paid = !!(this.state && this.state.paid);
    return {
      paid: paid,
      pending: !paid,
      pay: () => this.setState({ paid: true })
    };
  }
}
</script>
</body>
</html>
