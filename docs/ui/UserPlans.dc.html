<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">

</span>

<label style="display: flex; align-items: flex-start; gap: 12px; padding: 16px; background: #FFFFFF; border: 1px solid #C9D0CC; border-radius: 12px; cursor: pointer">

<span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px">

</span>

<span style="font-size: 12px; color: #56625C">[价格]</span>
</label>
<label style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; background: #FFFFFF; border: 2px solid #2B44C4; border-radius: 10px; cursor: pointer">

<span style="font-size: 12px; color: #56625C">[价格]</span>

<button type="button" style="flex: none; min-height: 46px; padding: 0 16px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; color: #18201D; font: inherit; font-weight: 500; cursor: pointer">使用</button>
</div>
<span style="font-size: 13px; color: #1C6B45">优惠码已生效：[优惠内容]</span>
</div>

<section aria-labelledby="sum-h" style="display: flex; flex-direction: column; gap: 12px; padding: 18px; background: #FFFFFF; border: 1px solid #D9DFDB; border-radius: 12px">

<p style="margin: 0; font-size: 13px; color: #56625C">续费从当前到期日接着算，付款后到期时间变为 2027-03-15。订阅链接不变。</p>
</section>
