<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户侧 设置新密码</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6F5}
a{color:#2B44C4}a:hover{color:#1E3299}
:focus-visible{outline:2px solid #2B44C4;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 36px; background: #F4F6F5; color: #18201D; font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif; font-size: 15px; line-height: 1.6">

<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #2B44C4; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 600">S</span>
<span style="font-size: 18px; font-weight: 600">[你的服务名]</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">设置新密码</h1>
<p style="margin: 0; color: #56625C">账号 lin***@example.com</p>
</div>

<form style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw1" style="font-size: 14px; font-weight: 500">新密码</label>
<input id="pw1" type="password" autocomplete="new-password" aria-describedby="pw-rule" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
<span id="pw-rule" style="font-size: 13px; color: #56625C">至少 8 位，不要和其他网站用同一个密码</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pw2" style="font-size: 14px; font-weight: 500">再输入一次</label>
<input id="pw2" type="password" autocomplete="new-password" aria-describedby="pw-err" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #B42318; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
<span id="pw-err" style="font-size: 13px; color: #B42318">两次输入的密码不一样</span>
</div>
<a href="UserLogin.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 6px; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">保存新密码</a>
</form>

<p style="margin: 0; padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #D9DFDB; font-size: 14px; color: #2E3833">保存后，其他设备上的网页登录会退出。订阅链接不受影响，客户端不用重新导入。</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
