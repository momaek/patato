<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>用户侧 登录</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#F4F6F5}
a{color:#2B44C4}a:hover{color:#1E3299}
:focus-visible{outline:2px solid #2B44C4;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 24px 32px; display: flex; flex-direction: column; gap: 40px; background: #F4F6F5; color: #18201D; font-family: 'IBM Plex Sans', 'Noto Sans SC', system-ui, sans-serif; font-size: 15px; line-height: 1.6">

<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #2B44C4; display: inline-flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 600">S</span>
<span style="font-size: 18px; font-weight: 600">[你的服务名]</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3">登录</h1>
<p style="margin: 0; color: #56625C">原来的账号和密码可以直接登录，订阅链接不变。</p>
</div>

<form style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 500">邮箱</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<label for="pw" style="font-size: 14px; font-weight: 500">密码</label>
<a href="UserForgot.dc.html" style="font-size: 14px">忘记密码</a>
</div>
<input id="pw" type="password" autocomplete="current-password" style="min-height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9D0CC; border-radius: 10px; background: #FFFFFF; font: inherit; color: #18201D">
</div>
<a href="UserHome.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; margin-top: 6px; border-radius: 10px; background: #2B44C4; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">登录</a>
</form>

<p role="alert" style="margin: 0; padding: 12px 14px; border-radius: 10px; background: #FBE9E7; color: #B42318; font-size: 14px">邮箱或密码不对。连续输错 5 次后需要等 15 分钟再试。</p>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; text-align: center">
<p style="margin: 0; font-size: 14px; color: #56625C">还没有账号？<a href="UserRegister.dc.html">注册</a></p>
<p style="margin: 0; font-size: 13px; color: #56625C">遇到问题请联系 [客服联系方式]</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
